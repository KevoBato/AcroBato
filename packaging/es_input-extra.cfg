<?xml version="1.0"?>
<!--
  Controller mappings added on top of Batocera's es_input.cfg (merged first, so an
  exact GUID here wins over Batocera's name-matched entries).

  Steam Deck read directly by SDL's HIDAPI driver (what a desktop app sees when Steam
  is running, LCD and OLED). Batocera's own "Steam Deck" entries are for the kernel
  hid-steam evdev device, whose button numbers differ, so applying them here gave
  wrong buttons (e.g. d-pad up read as a back paddle).
  SDL HIDAPI order: 0 A, 1 B, 2 X, 3 Y, 4 View, 5 Steam, 6 Menu, 7 L3, 8 R3, 9 L1, 10 R1,
  11 up, 12 down, 13 left, 14 right, 15 "...", 16-19 back paddles; axes 0-3 sticks, 4/5 triggers.
  Batocera naming: b = confirm = south (A), a = back = east (B), x = north (Y), y = west (X).
  Hotkey = View (Steam and "..." are taken by the Steam client).
-->
<inputList>
	<inputConfig type="joystick" deviceName="Steam Deck" deviceGUID="0300f617de2800000512000000036800">
		<input name="a" type="button" id="1" value="1" />
		<input name="b" type="button" id="0" value="1" />
		<input name="x" type="button" id="3" value="1" />
		<input name="y" type="button" id="2" value="1" />
		<input name="up" type="button" id="11" value="1" />
		<input name="down" type="button" id="12" value="1" />
		<input name="left" type="button" id="13" value="1" />
		<input name="right" type="button" id="14" value="1" />
		<input name="select" type="button" id="4" value="1" />
		<input name="hotkey" type="button" id="4" value="1" />
		<input name="start" type="button" id="6" value="1" />
		<input name="pageup" type="button" id="9" value="1" />
		<input name="pagedown" type="button" id="10" value="1" />
		<input name="l2" type="axis" id="4" value="1" />
		<input name="r2" type="axis" id="5" value="1" />
		<input name="l3" type="button" id="7" value="1" />
		<input name="r3" type="button" id="8" value="1" />
		<input name="joystick1left" type="axis" id="0" value="-1" />
		<input name="joystick1up" type="axis" id="1" value="-1" />
		<input name="joystick2left" type="axis" id="2" value="-1" />
		<input name="joystick2up" type="axis" id="3" value="-1" />
	</inputConfig>
</inputList>
